[package]
name = "prmn"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["chickencuber"]
repository = "https://github.com/chickencuber/prmn2"
description = "a project management tui app"

[dependencies]
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
cmdparsing = "2.2.5"
dirs = "6.0.0"
anyhow="1.0.102"
tt-call="1.0.9"
tt-equal="0.1.2"
fuzzy-matcher = "0.3.7"
[dependencies.cursive]
version = "0.21.1"
default-features = false
features = ["termion-backend"]
